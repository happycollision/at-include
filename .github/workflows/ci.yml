name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is included per the "if it is just easy" ask: the fixture
    # harness (test/cli_test.go) already has Windows-specific handling
    # (isWindows(), the appended ".exe" suffix), and .gitattributes marks
    # test/cases/** -text so fixture bytes checkout unmodified (no CRLF
    # rewriting) on every OS. That said, this has never actually been run on
    # Windows, so a real Windows-only failure (e.g. a path-separator or
    # line-ending edge case the porting effort missed) shouldn't block
    # Linux/macOS merges while it's being triaged for the first time.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          version: 2026.5.18
          install: true
          cache: true

      # mise.lock is committed; mise-action detects it and runs
      # `mise install --locked` automatically, which fails if the lockfile
      # doesn't match what mise.toml can actually resolve/install. That is
      # already the lockfile-drift check this project needs, so there is no
      # separate step for it here.

      - name: Check (format, lint, test)
        run: mise run check
        shell: bash

      - name: Build release-shaped binary
        run: mise run build
        shell: bash
