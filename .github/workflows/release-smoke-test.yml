name: Release smoke test

# Verifies a published release the way a consumer actually meets it: installed
# from its GitHub release archive by mise, never built from source. The main CI
# suite always compiles the binary itself, so it structurally cannot catch a
# release archive whose name doesn't match what mise expects, a missing or
# misnamed asset, a platform archive that failed to upload, or version metadata
# lost between goreleaser and the shipped binary.
#
# Triggering — and why this is NOT `release: types: [published]`:
#
# This workflow originally keyed on `release: published`, on the reasoning that
# the event fires only after GitHub has created the release and attached its
# assets, which would sidestep any race. That reasoning was wrong in a way that
# made the gate silently dead: GitHub does not dispatch workflow-triggering
# events for actions taken with the default GITHUB_TOKEN, to prevent recursive
# workflow loops. goreleaser creates the release with secrets.GITHUB_TOKEN, so
# the `release: published` event is suppressed. Verified on the v0.2.0 release
# (2026-08-06): the release published fine with all six assets, and no
# `release`-event run was created at all.
#
# Two ways to make it actually fire: create the release with a PAT or GitHub App
# token so the event is dispatched, or hang the check off the Release workflow
# run itself. The latter wins — no extra secret to store and rotate, and it
# keeps working for a fork or a re-run — at the cost of having to handle the
# API-visibility race ourselves rather than assuming it away. Hence the
# explicit wait step below.
#
# `workflow_run` (not a `needs:` job inside release.yml) keeps this a separate
# file, so it can still be re-run on demand against any past release via
# workflow_dispatch, and a red smoke test is reported distinctly from a failed
# release rather than being buried in the release run.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v0.1.1). Defaults to the latest release."
        required: false
        type: string

# Only needs to read the repo and query releases. The install path verifies
# GitHub artifact attestations, which are public for a public repo, so no
# attestations: read scope is required here.
permissions:
  contents: read

jobs:
  smoke-test:
    # On a workflow_run trigger, only proceed if the Release workflow actually
    # succeeded — a failed or cancelled release has nothing worth smoke-testing,
    # and letting it through would report a confusing second failure. A manual
    # workflow_dispatch always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        # One leg per platform archive that goreleaser publishes, so each is
        # proven to download, extract, and execute — not just the linux one.
        # The runners cover linux/amd64, darwin/arm64 (macos-latest is Apple
        # silicon), and windows/amd64. The remaining published archives
        # (linux/arm64, darwin/amd64) have no free hosted runner; they are
        # covered by the checksums.txt verification every leg performs, and
        # adding paid arm64 runners isn't worth it for this project's size.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # On a workflow_run trigger, checkout defaults to the repository's default
      # branch, NOT the ref that triggered the upstream run — so without an
      # explicit ref this would run whatever version of the smoke-test script is
      # on master, rather than the one from the commit actually being released.
      # Pin it to the triggering run's SHA (empty for workflow_dispatch, where
      # the default branch is the right choice).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Resolve which version to test, without a hardcoded number anywhere.
      #
      # For a workflow_run trigger the tag comes from the triggering Release
      # run's head_branch: release.yml is `on: push: tags`, so its head_branch
      # is the tag ref that started it (e.g. "v0.2.0") — confirmed against the
      # v0.1.1 and v0.2.0 release runs, whose headBranch values are exactly the
      # tags. For a manual dispatch it comes from the optional input, falling
      # back to whatever GitHub currently considers the latest release.
      #
      # Two values come out of this: the tag (e.g. "v0.1.1") and the bare
      # version (e.g. "0.1.1"). They are NOT interchangeable. goreleaser sets
      # {{.Version}} to the tag with the leading "v" stripped, so the shipped
      # binary reports "at-include 0.1.1" while the tag is "v0.1.1", and mise's
      # github backend likewise wants the bare version. Asserting the binary's
      # --version against the tag verbatim would fail on every release.
      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RUN_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            echo "No tag given; using the latest release."
          fi
          # Guard against a workflow_run from something that wasn't a tag push
          # (e.g. a re-run of Release against a branch): the smoke test only
          # means anything against a real release tag.
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Refusing to smoke-test '$tag': not a version tag." >&2; exit 1 ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing tag $tag (expecting binary version $version)."
        shell: bash

      # Wait for the release to be queryable before installing.
      #
      # This is the race the original `release: published` design existed to
      # avoid, and now has to be handled directly. Two distinct things can lag
      # after goreleaser exits:
      #
      #   1. The release/assets appearing in the API. Measured on v0.2.0: assets
      #      reached state "uploaded" at 13:28:37 and published_at was 13:28:38,
      #      i.e. already settled when goreleaser finished — so this is usually
      #      a no-op, but it costs one API call to be sure.
      #   2. mise's own view of it. mise resolves versions through the GitHub
      #      releases API and caches the response on disk
      #      (~/.cache/mise/github/*-all-releases-*.msgpack.z), so a stale
      #      "no such version" answer can persist. MISE_FETCH_REMOTE_VERSIONS_TIMEOUT
      #      doesn't help; the fix is to not have a warm cache, which a fresh
      #      runner guarantees (cache: false on mise-action below), plus this
      #      poll confirming the version is actually listed before we install.
      #
      # Polls for up to ~2 minutes. A flaky release gate is worse than none, so
      # this fails loudly rather than proceeding into a confusing install error.
      - name: Wait for the release to be queryable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' 2>/dev/null | grep -q .; then
              echo "Release $TAG is queryable with assets (attempt $attempt)."
              exit 0
            fi
            echo "Release $TAG not queryable yet; retrying in 5s (attempt $attempt/24)."
            sleep 5
          done
          echo "::error::Release $TAG never became queryable." >&2
          exit 1
        shell: bash

      # A consumer-shaped mise.toml, generated at runtime so no release version
      # is ever pinned in the repo. This is the whole point of the rewrite: the
      # old examples/consumer-smoke-test/ pinned an exact version that had to
      # be hand-bumped after every release, so it silently only ever tested one
      # increasingly old release.
      - name: Write a consumer-shaped mise.toml
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '[tools]\n"github:happycollision/at-include" = "%s"\n' "$VERSION" > mise.toml
          cat mise.toml
        shell: bash

      # The install log is where the supply-chain verification becomes visible:
      # mise prints "checksum", "verify GitHub artifact attestations", and
      # "verify SLSA provenance" lines as it installs from the release archive.
      # Keeping install in its own step means a failure here (bad archive,
      # missing asset, failed attestation) is immediately distinguishable from
      # a behavioral failure in the smoke test that follows.
      - uses: jdx/mise-action@v2
        with:
          version: 2026.5.18
          install: false
          cache: false

      - name: Install at-include from its published release
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mise trust
          mise install --verbose
        shell: bash

      # `mise exec` puts the installed binary on PATH for the script, which
      # invokes it as plain `at-include`. That resolves the ".exe" on Windows
      # without the script needing an OS-specific suffix, unlike the Go fixture
      # suite (test/cli_test.go), which references the build output path
      # directly and so has to append it itself.
      - name: Run the release smoke test
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mise exec -- bash "$GITHUB_WORKSPACE/.github/scripts/release-smoke-test.sh" "$VERSION"
        shell: bash
