version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # ifElseChain style-nit: prefers switch over if/else chains, but a
        # short if/else-if chain (e.g. resolveOptions's early-return errors)
        # is often clearer than a switch with no shared subject; the check
        # produces churn without a readability win here.
        - ifElseChain
      settings:
        hugeParam:
          # flatten.Options (128 bytes, after adding the Stdin io.Reader
          # field; was 112 bytes) and cli.options (96 bytes) are passed by
          # value throughout as an established package convention (an
          # immutable, small config struct, not a hot-path allocation
          # concern). Raising the threshold above both sizes avoids
          # pointerizing them purely for lint appeasement, which would add
          # aliasing risk for no behavioral benefit. 144 gives the same
          # headroom above the new 128-byte size that the old 128 threshold
          # gave above the previous 112-byte size. See task notes / review
          # history for the explicit decision.
          sizeThreshold: 144
  exclusions:
    rules:
      # gosec's file/dir-permission and G304-path-taint checks are relevant to
      # production code (and are handled there with justified inline #nosec
      # annotations) but not to test code, which routinely creates scratch
      # dirs/files with fixed permissions and reads back paths it just wrote
      # itself. Excluding the whole test tree avoids annotating ~14 findings
      # across cli_test.go/check_test.go/expand_test.go with no safety value.
      - path: (_test\.go|^test/)
        linters:
          - errcheck
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
