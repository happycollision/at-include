[tools]
go = "1.25.6"
golangci-lint = "2.12.2"
gofumpt = "0.11.0"
goreleaser = "2.17.1"
lefthook = "2.1.10"

[env]
# Prevent Go from auto-downloading a different toolchain than the one pinned above.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build the at-include binary into ./dist"
# The -X path here is the one, canonical version-injection point (see the doc
# comment on cli.Version in internal/cli/cli.go) — the goreleaser config must
# use this same path.
#
#
# This uses command substitution, which cmd.exe cannot parse, so it pins bash
# for Windows. Unlike `check`, that costs nothing here: `go` is invoked
# directly rather than by a child process that needs mise's PATH.
shell = "bash -c"
run = "go build -trimpath -ldflags \"-s -w -X github.com/happycollision/at-include/internal/cli.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o dist/at-include ./cmd/at-include"

[tasks.test]
description = "Run all tests (unit + fixture CLI suite)"
depends = ["build"]
run = "go test ./... -count=1"

[tasks.fmt]
description = "Format all Go code with gofumpt"
run = "gofumpt -l -w ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.check]
description = "Verify formatting, lint, and tests — what CI runs"
# No formatting gate of its own: .golangci.yml enables gofumpt as a formatter,
# so `golangci-lint run` already fails on unformatted files ("File is not
# properly formatted (gofumpt)"). An earlier shell-scripted gate here was both
# redundant and unportable — it needed POSIX syntax that cmd.exe cannot parse,
# and forcing bash cost the task its mise-provided PATH, hiding the Go toolchain
# from golangci-lint on Windows. Plain commands work on every platform.
run = [
  "golangci-lint run",
  "go test ./... -count=1",
]

[tasks.ci]
description = "Alias for check"
depends = ["check"]

[tasks.docs]
description = "Regenerate AGENTS.md from AGENTS.src.md (dogfoods at-include on this repo)"
depends = ["build"]
shell = "bash -c" # see the note on [tasks.build]
run = "./dist/at-include"

[tasks."docs:check"]
description = "Verify AGENTS.md is up to date (CI gate, dogfoods at-include on this repo)"
depends = ["build"]
shell = "bash -c" # see the note on [tasks.build]
run = "./dist/at-include --check"

