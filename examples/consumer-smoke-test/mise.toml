# A consumer-shaped mise.toml: installs at-include from its published release,
# exactly as README.md instructs. Nothing here builds from the parent repo's
# source — that is the point. This directory exists to catch installation
# regressions (bad archive names, missing assets, broken ldflags).
[tools]
"github:happycollision/at-include" = "0.1.0"

[tasks.docs]
description = "Regenerate AGENTS.md from AGENTS.src.md"
run = "at-include"

[tasks."docs:check"]
description = "Fail if AGENTS.md is stale (the CI gate)"
run = "at-include --check"
